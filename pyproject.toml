[project]
name = "pykynomesh"
version = "0.1.0"
description = "Kynomesh Python SDK"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "a2a-sdk[http-server,grpc]>=1.1.2",
    "fastapi>=0.110",
    # Newer grpcio-health-checking releases generate protobuf 7.x gencode,
    # which conflicts with a2a-sdk's protobuf 6.x runtime requirement.
    "grpcio-health-checking>=1.75,<1.77",
    "protobuf>=6,<7",
    "rfc8785>=0.1.4",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "trustme>=1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kynomesh"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["kynomesh"]
