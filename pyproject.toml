[project]
name = "kynomesh-py"
version = "0.1.0"
description = "Kynomesh Python SDK"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "a2a-sdk[http-server]>=1.1.2",
    "fastapi>=0.110",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kynomesh"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
